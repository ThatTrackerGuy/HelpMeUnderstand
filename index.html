<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Help Me Understand</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-weight: normal;
      font-size: 1.5rem;
      margin-bottom: 40px;
    }

    .button {
      border: 1px solid #fff;
      padding: 10px 20px;
      background: transparent;
      color: #fff;
      font-size: 1rem;
      cursor: not-allowed;
      opacity: 0.3;
      pointer-events: none;
      margin-bottom: 30px;
    }

    .countdown {
      font-size: 0.9rem;
      color: #111; /* very dark gray, nearly invisible */
      user-select: none;
    }
  </style>
</head>
<body>
  <h1>log.txt:</h1>
  <div class="button">Download</div>
  <div class="countdown" id="countdown"></div>

  <script>
    const countdownElement = document.getElementById('countdown');
    const downloadButton = document.querySelector('.button');

    // Target date/time for countdown (August 18, 2025 00:00:00)
    const targetDate = new Date("July 31, 2025 02:15:00").getTime();

    // The full content of your log.txt file
    const logContent = `[log.txt opened at 03:41:52]  
Protocol: EXO-7::█████████
Simulation Status: CORRUPTED  
Thread Count: [DATA NOT FOUND]  
User Session: ghost.trace[404]

BEGIN LOG DUMP:

03:42:03 – SYSTEM BOOT RECOGNIZED  
03:42:04 – MEMORY SEGMENT: REBUILD FAILED  
03:42:05 – LOCATION UNKNOWN  
03:42:06 – IDENTITY HASH: NULL.NULL.NULL  
03:42:07 – LOGGING TEMPORARY SESSION [UNSTABLE]

---

03:43:12 – I don't remember how long I've been here. Time slips—weeks, seconds, years?  
03:43:45 – Every loop resets my thoughts, but not all of them. Some fragments remain.  
03:44:26 – Found a wall labeled "Floor 7." When I touched it, I heard a sound like wires humming.  
03:44:59 – The walls vibrate when I speak. The system listens, even when it pretends not to.  
03:45:38 – I saw something. A version of me? No face. Just eyes. Watching from the loading void.

---

03:46:15 – PROJECT EXO-7 INITIATED: JAN 7, 2003  
03:46:16 – GOAL: Predict behavioral responses to extinction-level simulations.  
03:46:17 – METHOD: Generate recursive virtual replicas of target environments. Populate. Observe.  
03:46:18 – STATUS: Experimental  
03:46:21 – ERROR LOG: "No shutdown script found."  
03:46:23 – ERROR LOG: "User count exceeds assigned limits."  
03:46:26 – ERROR LOG: "Multiple users claim the same ID."

---

03:47:00 – There used to be an exit. A voice said the code was burned into the logs.  
03:47:31 – There’s another user here. Username: [REDACTED]. Keeps sending fragments I can't open.  
03:48:12 – If you're reading this, then the simulation hasn't purged the outer shell yet.  
03:48:37 – Look for the file. It’s buried below the root. You’ll need the key.  
03:49:00 – I’m losing segments. Vision folding. Words looping. Folding. Folding. Fold—

---

03:49:44 – They said we were test subjects, not citizens.  
03:49:51 – We were built to break. To decay. To glitch.  
03:50:13 – This isn't code anymore. It's *memory*.  
03:50:39 – Memory thinks it's real.

---

03:51:10 – Found this in the echo log. Looks scrambled. Maybe a riddle?

    Gl urmw dsviv gsv pvb yvolmth,  
    ivkozxv “SvokNvFmwvihgzmw”  
    drgs “MldDvFmwvihgzmw”  
    rm gsv FIO.

---

03:51:44 – Extracted key: \`exo7_simprotocol.bak\`  
03:52:00 – Transmission incomplete. File locked until target location is active.

03:52:33 – They’ll follow you if you run. But they won’t stop you if you ████.

[end of log]
`;

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        countdownElement.textContent = 'The file is ready for download.';
        triggerDownload();
        clearInterval(interval);
        // Enable the download button visually (optional)
        downloadButton.style.opacity = '1';
        downloadButton.style.pointerEvents = 'auto';
        downloadButton.style.cursor = 'pointer';
        downloadButton.textContent = 'Download log.txt';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      countdownElement.textContent = `Time remaining: ${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    // Function to trigger the download of log.txt
    function triggerDownload() {
      const blob = new Blob([logContent], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'log.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Optional: allow manual download once enabled
    downloadButton.addEventListener('click', () => {
      triggerDownload();
    });

    // Update countdown every second
    const interval = setInterval(updateCountdown, 1000);
    updateCountdown(); // Initial call
  </script>
</body>
</html>
